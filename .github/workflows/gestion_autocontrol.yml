name: Gestión Autocontrol, Cierre de Kanban y Sincronización GitHub Projects

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

permissions:
  contents: write
  issues: write

jobs:
  autocontrol:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auditar Nomenclatura, Ubicación de Carpetas, Alertas y Cierre Automático
        id: audit
        env:
          GH_TOKEN: ${{ secrets.PAT_PROJECT || secrets.GITHUB_TOKEN }}
        run: |
          echo "=========================================================="
          echo "   AUDITORÍA AUTOMÁTICA Y CIERRE KANBAN - RFP-CCM-EM-001  "
          echo "=========================================================="

          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }})

          if [ -z "$CHANGED_FILES" ]; then
            echo "ℹ️ No se detectaron cambios en archivos para auditar."
            exit 0
          fi

          VERSION_ALERT_LOG=""

          for FILE in $CHANGED_FILES; do
            if [[ "$FILE" =~ ^\.git ]] || [[ "$FILE" == "README.md" ]]; then
              continue
            fi

            BASENAME=$(basename "$FILE")
            DIRNAME=$(dirname "$FILE")

            echo "🔍 Analizando: $FILE"

            # Regex oficial estricta: E0-E4 / EF + TIPO + NOMBRE + vMAYOR.MENOR.ext
            STRICT_REGEX="^(E[0-4](\.[0-9]+)?|EF)_(DOC|DWG|SIM|PY|RPT|VID)_[A-Za-z0-9_]+_v[0-9]+\.[0-9]+\.[a-zA-Z0-9]+$"

            # Check if deliverable code exists (e.g., E0, E1.1, E1.2, E1.3, E1.4)
            if [[ "$BASENAME" =~ ^(E[0-4](\.[0-9]+)?|EF) ]]; then
              ENTREGABLE=$(echo "$BASENAME" | grep -oE "^(E[0-4](\.[0-9]+)?|EF)")

              if [[ "$BASENAME" =~ $STRICT_REGEX ]]; then
                TIPO=$(echo "$BASENAME" | cut -d'_' -f2)
                VERSION=$(echo "$BASENAME" | grep -oE "v[0-9]+\.[0-9]+")
                echo "   ✅ Nomenclatura correcta."
                echo "   📌 Entregable: $ENTREGABLE | Tipo: $TIPO | Versión: $VERSION"

                # --- VALIDACIÓN DE UBICACIÓN DE CARPETA SEGÚN TIPO ---
                LOCATION_OK=true
                EXPECTED_DIR=""

                case "$TIPO" in
                  SIM|PY)
                    EXPECTED_DIR="01_Proceso_y_Simulacion"
                    if [[ ! "$DIRNAME" =~ ^01_Proceso_y_Simulacion ]]; then
                      LOCATION_OK=false
                    fi
                    ;;
                  DWG)
                    EXPECTED_DIR="02_Ingenieria_y_Diagramas"
                    if [[ ! "$DIRNAME" =~ ^02_Ingenieria_y_Diagramas ]]; then
                      LOCATION_OK=false
                    fi
                    ;;
                  DOC|RPT|VID)
                    EXPECTED_DIR="03_Entregables_Finales o 00_Gestion_Proyecto"
                    if [[ ! "$DIRNAME" =~ ^(03_Entregables_Finales|00_Gestion_Proyecto) ]]; then
                      LOCATION_OK=false
                    fi
                    ;;
                esac

                if [ "$LOCATION_OK" = "false" ]; then
                  echo "::warning file=$FILE::⚠️ ALERTA DE UBICACIÓN: El archivo '$BASENAME' de tipo '$TIPO' está en '$DIRNAME', pero debe guardarse en '$EXPECTED_DIR'. Por favor muévelo a la carpeta correcta."
                  VERSION_ALERT_LOG="${VERSION_ALERT_LOG}\n* ⚠️ **ALERTA DE UBICACIÓN EN ${ENTREGABLE}:** El archivo \`${BASENAME}\` está en carpeta incorrecta (\`${DIRNAME}\`). Ubicación esperada: \`${EXPECTED_DIR}\`."
                else
                  echo "   📂 Ubicación de carpeta correcta ($DIRNAME)."
                fi

                # Cierre automático de tarjeta Kanban local KANBAN.md
                if [ -f "KANBAN.md" ]; then
                  sed -i "/\[${ENTREGABLE}\]/s/- \[ \]/ - \[x\]/" KANBAN.md || true
                  echo "   🎯 Tarjeta [${ENTREGABLE}] marcada como completada en KANBAN.md"
                fi

                # Actualizar Matriz RACI si existe
                MATRIZ_RACI="00_Gestion_Proyecto/Matriz_RACI/RACI_General_v1.0.md"
                if [ -f "$MATRIZ_RACI" ]; then
                  sed -i "/\[${ENTREGABLE}\]/s/📅 Todo/✅ Done/" "$MATRIZ_RACI" || true
                  sed -i "/\[${ENTREGABLE}\]/s/⏳ In Progress/✅ Done/" "$MATRIZ_RACI" || true
                  sed -i "/\[${ENTREGABLE}\]/s/🔍 Review \/ QA/✅ Done/" "$MATRIZ_RACI" || true
                fi

                # Cierre automático del Issue en GitHub Projects Web via GitHub API
                ISSUE_NUM=$(gh issue list --search "[$ENTREGABLE]" --json number --jq '.[0].number' 2>/dev/null || true)
                if [ -n "$ISSUE_NUM" ]; then
                  gh issue close "$ISSUE_NUM" --reason "completed" 2>/dev/null || true
                  echo "   🎯 Issue #$ISSUE_NUM en GitHub cerrado automáticamente (Done)."
                fi

                if [[ ! "$VERSION" =~ v1\.0 ]]; then
                  VERSION_ALERT_LOG="${VERSION_ALERT_LOG}\n* ℹ️ **Actualización de Versión en ${ENTREGABLE}:** Se entregó la versión \`${VERSION}\` (versión borrador/actualizada diferente a v1.0 final esperada). Tarjeta Kanban cerrada automáticamente."
                fi

              else
                # Alerta explícita de corrección de nombre (ej. por usar _v0_2 en vez de _v0.2)
                echo "::warning file=$FILE::⚠️ ALERTA DE NOMENCLATURA: El archivo '$BASENAME' no cumple con el estándar exacto [ENTREGABLE]_[TIPO]_[NombreDescriptivo]_v[MAYOR].[MENOR].[ext]. Por favor corrige el nombre según la convención (ej. cambiar '_v0_2' a '_v0.2')."
                echo "   ❌ ERROR DE NOMENCLATURA: '$BASENAME' requiere corrección de etiqueta."

                # Aun con error de formato en versión (ej. _v0_2), reconocemos el código y cerramos la tarjeta
                if [ -f "KANBAN.md" ]; then
                  sed -i "/\[${ENTREGABLE}\]/s/- \[ \]/ - \[x\]/" KANBAN.md || true
                  echo "   🎯 Tarjeta [${ENTREGABLE}] marcada como completada en KANBAN.md (pendiente corrección de nombre)."
                fi

                # Cierre automático del Issue en GitHub Projects Web
                ISSUE_NUM=$(gh issue list --search "[$ENTREGABLE]" --json number --jq '.[0].number' 2>/dev/null || true)
                if [ -n "$ISSUE_NUM" ]; then
                  gh issue close "$ISSUE_NUM" --reason "completed" 2>/dev/null || true
                  echo "   🎯 Issue #$ISSUE_NUM en GitHub cerrado automáticamente (Done)."
                fi

                VERSION_ALERT_LOG="${VERSION_ALERT_LOG}\n* ⚠️ **ALERTA DE NOMENCLATURA EN ${ENTREGABLE}:** El archivo \`${BASENAME}\` fue entregado con formato incorrecto de versión/nombre. Se requiere renombrar según el estándar \`vX.X\`."
              fi
            else
              echo "   ℹ️ Archivo general fuera de la clasificación de entregables oficiales."
            fi
            echo "----------------------------------------------------------"
          done

          echo "VERSION_ALERT_LOG<<EOF" >> $GITHUB_ENV
          echo -e "$VERSION_ALERT_LOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Sincronizar Tarjetas y Fechas de Roadmap en GitHub Projects v2 via GraphQL
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.PAT_PROJECT || secrets.GITHUB_TOKEN }}
        run: |
          echo "=========================================================="
          echo "   SINCRONIZANDO TAREAS Y FECHAS DE ROADMAP EN GITHUB     "
          echo "=========================================================="

          # Crear etiquetas por defecto si no existen
          for L in "E0" "E1.1" "E1.2" "E1.3" "E1.4" "DOC" "SIM" "DWG" "PY" "VID" "DWSIM" "CAD" "HSE"; do
            gh label create "$L" --force 2>/dev/null || true
          done

          EXISTING_ISSUES=$(gh issue list --state all --limit 500 --json title --jq '.[].title' 2>/dev/null || true)

          sync_issue() {
            local title="$1"
            local body="$2"
            local assignee="$3"
            local labels="$4"
            local is_done="$5"

            local clean_assignee=$(echo "$assignee" | tr -d '@' | cut -d' ' -f1)

            if echo "$EXISTING_ISSUES" | grep -qF "$title"; then
              echo "   ℹ️ La tarjeta / issue '$title' ya existe en GitHub."
            else
              echo "   ✨ Creando Issue en GitHub: '$title' para $clean_assignee"
              gh issue create --title "$title" --body "$body" --assignee "$clean_assignee" --label "$labels" --milestone "Entrega Etapa 1 — RFP-CCM-EM-001" 2>/dev/null || \
              gh issue create --title "$title" --body "$body" --label "$labels" 2>/dev/null || true
            fi

            if [ "$is_done" = "true" ]; then
              gh issue close --reason "completed" "$title" 2>/dev/null || true
            fi
          }

          # Sincronizar entregables oficiales como tarjetas en GitHub Issues/Projects
          sync_issue "[E0] Redactar Acta Constitutiva y Gestión Inicial" "### 📅 Fecha Asignación: 2026-08-14\n### 🎯 Fecha Límite: 2026-08-17\n**Asignado a:** @Karoc" "@Karoc" "E0,DOC" "true"
          sync_issue "[E1.1] Configuración de Bases de Diseño & Termodinámica" "### 📅 Fecha Asignación: 2026-08-17\n### 🎯 Fecha Límite: 2026-08-25\n**Asignado a:** @Cho0bb" "@Cho0bb" "E1.1,DOC,HSE" "true"
          sync_issue "[E1.2] Simulación de Procesos & Balances (DWSIM)" "### 📅 Fecha Asignación: 2026-08-18\n### 🎯 Fecha Límite: 2026-08-25\n**Asignado a:** @paulina145" "@paulina145" "E1.2,SIM,DWSIM" "true"
          sync_issue "[E1.3] Diagramación Plant 3D & Especificación Técnica" "### 📅 Fecha Asignación: 2026-08-19\n### 🎯 Fecha Límite: 2026-08-24\n**Asignado a:** @GildardoOca25" "@GildardoOca25" "E1.3,DWG,CAD" "true"
          sync_issue "[E1.4] Integración Python, Optimización & Video Pitch" "### 📅 Fecha Asignación: 2026-08-20\n### 🎯 Fecha Límite: 2026-08-25\n**Asignado a:** @Karoc" "@Karoc" "E1.4,PY,VID" "false"

          # Subtareas de Integración Documento Consolidado E1 (Cierre vía Git Commit)
          sync_issue "[E1-v0.0] Integración del E0 en Documento Consolidado E1" "### 📅 Fecha Asignación: 2026-08-26\n### 🎯 Fecha Límite: 2026-08-27 16:00\n**Asignado a:** @Karoc\n**Modalidad:** Cierre vía Git Commit" "@Karoc" "E1,v0.0,Integracion" "false"
          sync_issue "[E1-v0.1] Integración del E1.1 en Documento Consolidado E1" "### 📅 Fecha Asignación: 2026-08-26\n### 🎯 Fecha Límite: 2026-08-27 16:00\n**Asignado a:** @Cho0bb\n**Modalidad:** Cierre vía Git Commit" "@Cho0bb" "E1,v0.1,Integracion" "false"
          sync_issue "[E1-v0.2] Integración del E1.2 en Documento Consolidado E1" "### 📅 Fecha Asignación: 2026-08-26\n### 🎯 Fecha Límite: 2026-08-27 16:00\n**Asignado a:** @paulina145\n**Modalidad:** Cierre vía Git Commit" "@paulina145" "E1,v0.2,Integracion" "false"
          sync_issue "[E1-v0.3] Integración del E1.3 en Documento Consolidado E1" "### 📅 Fecha Asignación: 2026-08-26\n### 🎯 Fecha Límite: 2026-08-27 16:00\n**Asignado a:** @GildardoOca25\n**Modalidad:** Cierre vía Git Commit" "@GildardoOca25" "E1,v0.3,Integracion" "false"

          # Automatizar sincronización de fechas Start Date / Target Date en Project V2 via GraphQL
          python3 -c "
          import urllib.request, json, os

          token = os.environ.get('GH_TOKEN')
          if not token:
              exit(0)

          headers = {'Authorization': f'token {token}', 'Accept': 'application/vnd.github.v3+json'}
          url = 'https://api.github.com/graphql'

          project_id = 'PVT_kwHOD240784Bgkoq'
          start_field_id = 'PVTF_lAHOD240784BgkoqzhfjsCk'
          target_field_id = 'PVTF_lAHOD240784BgkoqzhfjsCo'

          issues = [
              (1, '2026-08-14', '2026-08-17'),
              (2, '2026-08-17', '2026-08-25'),
              (3, '2026-08-18', '2026-08-25'),
              (4, '2026-08-19', '2026-08-24'),
              (5, '2026-08-20', '2026-08-25'),
          ]

          for issue_num, s_date, t_date in issues:
              try:
                  q_issue = f'''query {{ repository(owner: \"karolcamachol29-sudo\", name: \"RFP-CCM-EM-001\") {{ issue(number: {issue_num}) {{ id }} }} }}'''
                  req = urllib.request.Request(url, data=json.dumps({'query': q_issue}).encode(), headers=headers, method='POST')
                  res = urllib.request.urlopen(req)
                  issue_node_id = json.loads(res.read())['data']['repository']['issue']['id']

                  m_add = f'''mutation {{ addProjectV2ItemById(input: {{projectId: \"{project_id}\", contentId: \"{issue_node_id}\"}}) {{ item {{ id }} }} }}'''
                  req_add = urllib.request.Request(url, data=json.dumps({'query': m_add}).encode(), headers=headers, method='POST')
                  res_add = urllib.request.urlopen(req_add)
                  item_id = json.loads(res_add.read())['data']['addProjectV2ItemById']['item']['id']

                  m_start = f'''mutation {{ updateProjectV2ItemFieldValue(input: {{ projectId: \"{project_id}\", itemId: \"{item_id}\", fieldId: \"{start_field_id}\", value: {{date: \"{s_date}\"}} }}) {{ projectV2Item {{ id }} }} }}'''
                  urllib.request.urlopen(urllib.request.Request(url, data=json.dumps({'query': m_start}).encode(), headers=headers, method='POST'))

                  m_target = f'''mutation {{ updateProjectV2ItemFieldValue(input: {{ projectId: \"{project_id}\", itemId: \"{item_id}\", fieldId: \"{target_field_id}\", value: {{date: \"{t_date}\"}} }}) {{ projectV2Item {{ id }} }} }}'''
                  urllib.request.urlopen(urllib.request.Request(url, data=json.dumps({'query': m_target}).encode(), headers=headers, method='POST'))
                  print(f'✅ Project V2 Item #{issue_num} GraphQL synced with dates: Start={s_date}, Target={t_date}')
              except Exception as e:
                  print(f'Issue #{issue_num} sync info:', e)
          "

      - name: Actualizar Bitácora Técnica Automáticamente
        run: |
          FECHA=$(date +%Y-%m-%d)
          HORA=$(date +%H:%M)
          BITACORA_FILE="04_Bitacora/BITACORA_${FECHA}.md"

          mkdir -p 04_Bitacora

          if [ ! -f "$BITACORA_FILE" ]; then
            echo "# Bitácora Técnica de Proyecto — RFP-CCM-EM-001" > "$BITACORA_FILE"
            echo "" >> "$BITACORA_FILE"
          fi

          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          AUTHOR=$(git log -1 --pretty=format:"%an")
          COMMIT_HASH=$(git log -1 --pretty=format:"%h")
          CHANGED_SUMMARY=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }} | tr '\n' ', ')

          echo "" >> "$BITACORA_FILE"
          echo "---" >> "$BITACORA_FILE"
          echo "" >> "$BITACORA_FILE"
          echo "## [${FECHA} ${HORA}] — Registro Automatizado de GitHub (Commit: ${COMMIT_HASH})" >> "$BITACORA_FILE"
          echo "**Responsable:** ${AUTHOR}  " >> "$BITACORA_FILE"
          echo "**Área / Módulo:** Control de Versiones / CI-CD  " >> "$BITACORA_FILE"
          echo "" >> "$BITACORA_FILE"
          echo "### 1. Actividades Realizadas" >> "$BITACORA_FILE"
          echo "* Commit: \"${COMMIT_MSG}\"" >> "$BITACORA_FILE"
          echo "* Archivos Modificados / Creados: \`${CHANGED_SUMMARY:-Ninguno}\`" >> "$BITACORA_FILE"
          echo -e "${VERSION_ALERT_LOG}" >> "$BITACORA_FILE"
          echo "" >> "$BITACORA_FILE"
          echo "### 2. Decisiones Técnicas y Supuestos" >> "$BITACORA_FILE"
          echo "* Trazabilidad automática de versiones de entregables y autocontrol de nomenclatura." >> "$BITACORA_FILE"
          echo "" >> "$BITACORA_FILE"
          echo "### 3. Problemas / Obstáculos Encontrados" >> "$BITACORA_FILE"
          echo "* Verificación de nomenclatura y control de versiones en entregables." >> "$BITACORA_FILE"
          echo "" >> "$BITACORA_FILE"
          echo "### 4. Próximos Pasos" >> "$BITACORA_FILE"
          echo "* Continuar con la entrega de avances según la Matriz RACI." >> "$BITACORA_FILE"

          echo "✅ Bitácora actualizada en: $BITACORA_FILE"

      - name: Autocommit de Cambios en KANBAN.md y Bitácora
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add KANBAN.md 04_Bitacora/ 00_Gestion_Proyecto/Matriz_RACI/
          git diff-index --quiet HEAD || git commit -m "chore(auto): autocontrol de entregables, alertas y cierre kanban [skip ci]"
          git push origin ${{ github.ref_name }} || true
